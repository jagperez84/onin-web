name: Fix OTD editor UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message != 'chore(otd): fix editor ui' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore CSS and apply UI fix
        shell: bash
        run: |
          git checkout 077b3fe15b075308e617d7ba53ac98a7f09cee34 -- src/modules/otd/otd.css
          python3 <<'PY'
          from pathlib import Path
          import re

          editor = Path('src/modules/otd/OtdEditorV2.tsx')
          text = editor.read_text()
          patterns = [
              r'<label[^>]*>\s*Notas técnicas de cálculo[^<]*<textarea[^>]*/>\s*</label>',
              r'<label[^>]*>\s*Notas técnicas de cálculo[^<]*<textarea[^>]*>.*?</textarea>\s*</label>',
              r'<textarea[^>]*placeholder=["\']Notas técnicas de cálculo[^"\']*["\'][^>]*/>',
              r'<textarea[^>]*placeholder=["\']Notas técnicas de cálculo[^"\']*["\'][^>]*>.*?</textarea>',
          ]
          for pattern in patterns:
              text = re.sub(pattern, '', text, flags=re.S)
          editor.write_text(text)

          css = Path('src/modules/otd/otd.css')
          styles = css.read_text()
          styles += '''\n\n/* OTD editor UI fixes */\n.otd-product-field {\n  position: relative;\n  overflow: visible !important;\n}\n\n.otd-product-picker {\n  top: calc(100% + 6px) !important;\n  left: 0;\n  right: 0;\n  z-index: 1000 !important;\n  width: 100%;\n  max-height: 320px;\n  box-sizing: border-box;\n}\n\n.otd-card,\n.otd-row-card,\n.otd-component-grid {\n  overflow: visible !important;\n}\n\n.otd-page textarea[placeholder*="Notas técnicas de cálculo"] {\n  display: none !important;\n}\n'''
          css.write_text(styles)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/otd/OtdEditorV2.tsx src/modules/otd/otd.css
          git rm .github/workflows/fix-otd-editor-ui.yml
          git commit -m "chore(otd): fix editor ui"
          git push origin HEAD:main
